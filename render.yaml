services:
  - type: web
    name: melkam-bingo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon

    # Build: install + compile everything
    buildCommand: ""   # Dockerfile handles the build

    # Start: push DB schema then launch server
    startCommand: >-
      sh -c 'pnpm --filter @workspace/db run push-force 2>&1
      || echo "[render] DB schema push failed — skipping";
      node artifacts/api-server/dist/index.mjs'

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # Set these in the Render dashboard → Environment:
      - key: NEON_DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional
      - key: MAIN_ADMIN_TELEGRAM_ID
        sync: false
      - key: ANNOUNCEMENT_CHANNEL_ID
        sync: false
      - key: LUCKY_BOX_CHANNEL_ID
        sync: false
      - key: REQUIRED_CHANNEL_IDS
        sync: false
      - key: SMS_WEBHOOK_SECRET
        sync: false
      - key: MINI_APP_URL
        value: melbetbingo.onrender.com
      - key: SESSION_SECRET
        sync: false

    healthCheckPath: /api/health
